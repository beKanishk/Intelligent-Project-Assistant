spring.application.name=backend

# Database config
spring.datasource.url=jdbc:mysql://localhost:3306/project_assistant
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Jackson (optional: to avoid timestamps)
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# WebSocket debug logging
#logging.level.org.springframework.web.socket=DEBUG
#logging.level.org.springframework.messaging=DEBUG
logging.level.com.assistant=DEBUG

# Show message handling
logging.level.org.springframework.messaging.simp.broker=DEBUG
logging.level.org.springframework.messaging.simp.stomp=DEBUG

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.socket=TRACE
logging.level.org.springframework.messaging=TRACE


