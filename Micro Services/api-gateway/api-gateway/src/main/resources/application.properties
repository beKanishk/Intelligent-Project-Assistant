spring.application.name=api-gateway
server.port=9000

# ========== Eureka ==========
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ========== Gateway Routes ==========
spring.cloud.gateway.server.webflux.routes[0].id=AUTHENTICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTHENTICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[1].id=USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/user/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[2].id=MESSAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].uri=lb://MESSAGE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/message/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[3].id=SESSION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].uri=lb://SESSION-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/sessions/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[4].id=AI-SERVICE
spring.cloud.gateway.server.webflux.routes[4].uri=lb://AI-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/ai/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=AuthenticationFilter

spring.cloud.gateway.server.webflux.routes[5].id=CHAT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].uri=lb://CHAT-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/ws/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=AuthenticationFilter
